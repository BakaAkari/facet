name: Protected CUDA Image
on:
  push:
    branches: [kari/sequence-protection]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: protected-cuda-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    if: github.repository == 'BakaAkari/facet'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests_capture -v
      - run: pip install pytest pytest-asyncio pytest-timeout fastapi[standard] httpx pyjwt pillow pillow-heif numpy scipy scikit-learn opencv-python-headless tqdm aiosqlite sqlite-vec imagehash psutil watchdog send2trash tifffile imagecodecs jsonschema
      - run: python -m pytest tests/test_capture_sequences.py tests/test_capture_api.py tests/test_sequence_detection.py tests/test_burst_culling.py tests/test_cull.py tests/test_auto_cull.py -q
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --no-audit --no-fund && npx tsc --noEmit -p tsconfig.app.json && npx tsc --noEmit -p tsconfig.spec.json && npm run build
        working-directory: client
  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/bakaakari/facet:sha-${{ github.sha }}-cuda
          labels: |
            org.opencontainers.image.source=https://github.com/BakaAkari/facet
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BASE_IMAGE=pytorch/pytorch:2.11.0-cuda12.8-cudnn9-runtime
            STRIP_TORCH=1
            INSTALL_CUML=1
            REQUIREMENTS_LOCK=requirements.lock.txt
      - name: Verify image before publication
        env:
          IMAGE: ghcr.io/bakaakari/facet:sha-${{ github.sha }}-cuda
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint id "$IMAGE" -u facet)" = 1000
          docker run --rm --entrypoint python "$IMAGE" -c 'import torch; assert torch.version.cuda == "12.8"; from utils.capture_sequences import sony_pixel_shift; assert sony_pixel_shift("01020304 1 4 0x0")'
          docker run --rm "$IMAGE" python facet.py --doctor
      - name: Publish tested image
        env:
          IMAGE: ghcr.io/bakaakari/facet:sha-${{ github.sha }}-cuda
        run: |
          docker push "$IMAGE"
          docker tag "$IMAGE" ghcr.io/bakaakari/facet:latest-cuda
          docker push ghcr.io/bakaakari/facet:latest-cuda
